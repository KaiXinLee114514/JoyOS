#
# 开机时内核会读这个文件(根目录的 RC.CONF);用 shell 的 `write RC.CONF ...`
# 改完,`rc reload` 立刻生效 —— 不用重做镜像。
#
# 语法(就三条规矩):
#   · 一行一个 key=value;空行和 # 开头的行忽略
#   · 值可以带双引号(带空格的值推荐加);key 不分大小写
#   · 行尾的注释只在值带引号时才安全(NO   # 注释 会把注释吃进值里)
#
# 认得的 key:
#   hostname        主机名(现在只显示,不影响命令提示符)
#   osname          系统显示名(默认 JoyOS;开机打一行 os: JoyOS)
#   boot_msg        开机打一行提示(配置生效的肉眼证明)
#   autostart       YES = 开机把启用的服务按顺序跑一遍(NO = 你自己 rc start)
#   on_crash        log(默认:只记账)| reboot(程序崩了就重启)
#   service_N       第 N 个服务跑哪个程序(N = 1..8)
#   service_N_enable  YES = 算"启用的服务"(配合 autostart)
#   service_N_args  传给程序的参数(等价于 run PROG 参数)
#
# 事件账本见 `rc log`:开机、读配置、服务起停、程序跑完/崩了、线程被 kill、
# 换 shell —— 每种都连 tick 一起记 16 条,`rc log` 翻。

hostname="joyos"
# osname = JoyOS        # 显示名:去掉行首 # 改成你的名字,开机就以它为准
boot_msg="hello from rc.conf (this line came off the disk)"
autostart="NO"          # 想让服务开机自己跑就改成 YES
on_crash="log"          # 改成 reboot 的话,程序崩了会直接重启机器

# 服务就是磁盘上的程序:跑的时候走的是 run 那条路(ring 3 + 按需分页)
service_1="HELLO.BIN"
service_1_enable="NO"
service_1_args="hi-from-rc-conf"

service_2="UTF8.BIN"
service_2_enable="NO"
